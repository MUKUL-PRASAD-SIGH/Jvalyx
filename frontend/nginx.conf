server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; the entry HTML must never be cached or a
    # redeploy keeps serving the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # NASA FIRMS CORS proxy
    location /firms-proxy/ {
        proxy_pass https://firms.modaps.eosdis.nasa.gov/;
        proxy_ssl_server_name on;
        proxy_set_header Host firms.modaps.eosdis.nasa.gov;
    }

    # Single-page app: unknown paths fall through to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
